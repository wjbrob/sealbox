# Sealbox browser core (gate G28): sealbox-crypto + the pure MIME half of sealbox-mail,
# compiled to wasm32-unknown-unknown with wasm-bindgen. Deliberately its own workspace so
# the native workspace (crates/*) never sees wasm-only dependencies or the vendored patch.
#
#   CARGO_TARGET_DIR=../../target/agent-ext cargo build --release --target wasm32-unknown-unknown
#   wasm-bindgen --target web|nodejs …   (scripts/gate_g28.sh does both)
[workspace]
exclude = ["vendor"]

[package]
name = "sealbox-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Sealbox OpenPGP + PGP/MIME core for the browser extension and Outlook add-in"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sealbox-crypto = { path = "../../crates/sealbox-crypto", features = ["js"] }
sealbox-mail = { path = "../../crates/sealbox-mail", default-features = false }
# Must match the wasm-bindgen CLI exactly (scripts/gate_g28.sh installs that version).
wasm-bindgen = "=0.2.118"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
base64 = "0.23"
# Passphrase wrapping of the stored secret key (Argon2id -> XChaCha20-Poly1305).
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1"

[patch.crates-io]
# wasm32 has no std clock; see vendor/mail-builder/SEALBOX_PATCH.md.
mail-builder = { path = "vendor/mail-builder" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep the hot crypto paths fast despite opt-level "s".
[profile.release.package.argon2]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3

# Argon2id is unusably slow unoptimised.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
