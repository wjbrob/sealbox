[package]
name = "rust_lib_sealbox_app"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "GPL-3.0-or-later"
description = "flutter_rust_bridge glue crate for the Sealbox Flutter app: exposes sealbox-core (the engine) to Dart"

# Stand-alone: this crate is built by cargokit from the Flutter build, not as a
# member of the repository's Rust workspace. The empty table stops cargo from
# trying to join the repository's root Cargo.toml.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
# The engine. rusqlite is bundled and TLS is rustls inside, so this builds for Linux today
# and for Android/iOS through cargokit + cargo-ndk without system libraries.
sealbox-core = { path = "../../crates/sealbox-core" }
tracing = "0.1"
log = "0.4"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# tests/bridge_fingerprint.rs: parses src/api/*.rs to pin the shape of the bridged surface,
# because frb's own rustContentHash does not move when a DTO field is edited.
syn = { version = "2", features = ["full", "parsing", "printing"] }
quote = "1"
sha2 = "0.10"
# The #[ignore] GreenMail test of the bridge's async methods (already in the tree via sealbox-core).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
