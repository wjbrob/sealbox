# libFuzzer harnesses for Sealbox's untrusted-input parsers (gate G13, scripts/gate_security.sh).
#
#   cargo +nightly fuzz build                       # all targets, ASan, from the repo root
#   cargo +nightly fuzz run mime_parse fuzz/corpus/mime_parse fuzz/seeds/mime_parse -- -max_total_time=120
#   cargo +nightly fuzz list
#
# Targets (one binary each, see fuzz_targets/*.rs): mime_parse, pgp_decrypt, autocrypt_header,
# guest_decrypt, autodiscover_xml, html_sanitize. Seed corpora are committed under seeds/<target>/ and are
# regenerated by `cargo run --manifest-path fuzz/seedgen/Cargo.toml`; the libFuzzer working
# corpus (corpus/), crash artifacts (artifacts/) and target/ are git-ignored.
#
# This package is deliberately outside the root workspace (root Cargo.toml excludes `fuzz`):
# it needs nightly + sanitizer flags that must never leak into the product build.
[package]
name = "sealbox-fuzz"
version = "0.0.0"
publish = false
license = "GPL-3.0-or-later"
edition = "2021"
description = "libFuzzer harnesses for Sealbox's untrusted-input parsers (gate G13)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `net` (default) is required for the autodiscover XML parser; the MIME and crypto targets
# use only the pure parts.
sealbox-mail = { path = "../crates/sealbox-mail" }
sealbox-crypto = { path = "../crates/sealbox-crypto" }
# Only for the harness's *wrapped* modes (fuzz/src/lib.rs): building a valid PKESK/SKESK + SEIPD
# container around the fuzz input needs rPGP's packet API, which sealbox-crypto does not expose.
# Same version as sealbox-crypto, so it is the same crate in the build graph.
pgp = "0.21.0"
rand = "0.8"

[lib]
name = "sealbox_fuzz"
path = "src/lib.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mime_parse"
path = "fuzz_targets/mime_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pgp_decrypt"
path = "fuzz_targets/pgp_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "autocrypt_header"
path = "fuzz_targets/autocrypt_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guest_decrypt"
path = "fuzz_targets/guest_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "autodiscover_xml"
path = "fuzz_targets/autodiscover_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_sanitize"
path = "fuzz_targets/html_sanitize.rs"
test = false
doc = false
bench = false

# Line tables so crash artifacts come with readable stack traces. Debug assertions and overflow
# checks are ON for every crate: scripts/gate_security.sh builds with `cargo fuzz build -O`, so
# cargo-fuzz leaves them to this profile instead of forcing `-Cdebug-assertions` on all crates
# through RUSTFLAGS — which is what allows the single, documented exception below.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

# mail-parser 0.11.9 (the last 0.11 release; 1.0 is an API rewrite) guards its multipart state
# machine with `debug_assert!(false, "Invalid part ID …")`, which fires on malformed nested
# message/rfc822 parts (G13 fuzz finding F4, docs/THREAT_MODEL.md R11). Release builds compile those
# asserts out and the parser recovers (the 105-byte reproducer parses to Ok in release), so for
# this one crate the fuzz build uses release semantics for debug_assert! only; its overflow
# checks stay on, and any real panic (index, slice, unwrap) in it is still a finding.
[profile.release.package.mail-parser]
debug-assertions = false

# Own workspace root; the seed generator is a separate tiny crate with its own workspace.
[workspace]
members = ["."]
exclude = ["seedgen"]
