# gitleaks configuration for gate G13 (scripts/gate_security.sh scans the full git history AND the
# working tree with it). The default rule set applies unchanged; the only additions are
# allow-lists for DOCUMENTED TEST MATERIAL, each scoped to a path (and, where a whole file would be
# too broad, to the exact line shape) with the reason it is not a secret. Nothing is allow-listed by
# commit or fingerprint, so a real secret added to any of these paths in a new shape is still found
# by the rules that do not match the listed line shapes, and anywhere else by every rule.
# Paths are relative to the repository root.

title = "Sealbox gitleaks config (gate G13)"

[extend]
useDefault = true

[[allowlists]]
description = "Fuzz TEST identities (fuzz/seeds/keys/*.asc, generated by fuzz/seedgen, public on purpose and named fuzz-*@sealbox.test) and the seed corpora, which embed their public keys as Autocrypt keydata"
paths = ['''^fuzz/seeds/''']

[[allowlists]]
description = "Documented TEST Android signing keystore (testing/keys/README.md: throw-away PKCS12 for G26/CI, public passwords, never shipped)"
paths = ['''^testing/keys/''']

[[allowlists]]
description = "Published RFC 9980 (OpenPGP post-quantum) sample keys and messages, used as gate G14 test vectors"
paths = ['''^crates/sealbox-crypto/tests/fixtures/''']

[[allowlists]]
description = "Rust integration-test fixtures: fixed test passphrases / guest-link secrets and Google's documented XOAUTH2 example token (developers.google.com/gmail/imap/xoauth2-protocol, test xoauth2_matches_google_documented_example)"
paths = ['''^crates/[^/]+/tests/''']

[[allowlists]]
description = "Guest-viewer tests: a fixed test link secret"
paths = ['''^web/guest/test/''']

[[allowlists]]
description = "Vendored OpenPGP.js 6.3.2 (web/guest/VENDOR.md, SHA-256 pinned): its armor-header string constants match the private-key rule"
paths = ['''^web/guest/vendor/openpgp\.(min\.js|node\.min\.mjs)$''']

[[allowlists]]
description = "Extension options page: the placeholder text of the secret-key import field (no key)"
condition = "AND"
paths = ['''^extension/chrome/static/options\.html$''']
regexTarget = "line"
regexes = ['''placeholder="-----BEGIN PGP PRIVATE KEY BLOCK-----"''']

[[allowlists]]
description = "Android review-loop logcat captures: verbose IMAP FETCH responses of the local GreenMail TEST mailboxes (base64 keydata of test keys) and a keyboard-cache key. Only these two line shapes; every other line of the captures is scanned"
condition = "AND"
paths = ['''^review/android/[^/]+/[^/]+/logcat\.txt$''']
regexTarget = "line"
regexes = [
  '''async_imap::imap_stream: decode: input: Ok\("\* \d+ FETCH \(''',
  '''MemoryFileCache\$2\.onFailure\(\):\d+ Load data from cache for key: [0-9a-f]{32} has been cancelled''',
]

[[allowlists]]
description = "sealbox-mail SMTP unit test xoauth2_token_never_goes_through_plain_or_login (commit d16e6d1): a made-up bearer that the test proves never reaches the wire; the next commit (3364de3) builds it at run time instead"
condition = "AND"
paths = ['''^crates/sealbox-mail/src/smtp\.rs$''']
regexTarget = "line"
regexes = ['''^\s*let token = "ya29\.never-on-the-wire-7f3a";$''']

[[allowlists]]
description = "Gate logs committed as evidence (.gate/gate_logs): scripts/perf_sync.sh prints the OpenPGP v4 fingerprint of the throw-away perf profile's key — a public identifier (40 hex digits), which the generic-api-key rule matches only because the line says 'key'. Only this exact line shape; every other line of the logs is scanned"
condition = "AND"
paths = ['''^\.gate/gate_logs/G[0-9]+\.log$''']
regexTarget = "line"
regexes = ['''(?m)^key fingerprint: [0-9A-F]{40}$''']   # (?m): in git mode gitleaks' "line" target spans more than one line, so the anchors must be per line
