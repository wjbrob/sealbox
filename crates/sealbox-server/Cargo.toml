[package]
name = "sealbox-server"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
publish.workspace = true
description = "Sealbox backend: VKS-style key directory, guest messages, client-encrypted backups"

[lib]
name = "sealbox_server"
path = "src/lib.rs"

[[bin]]
name = "sealbox-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
rusqlite = { version = "0.43", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
pgp = { version = "0.21", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2" # key-transparency tree heads (G30)

[dev-dependencies]
sealbox-core = { path = "../sealbox-core" } # G30: the client-side KT verifier in the gate test
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
