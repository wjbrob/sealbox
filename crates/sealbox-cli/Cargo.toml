[package]
name = "sealbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "sealbox — command-line client for Sealbox (e2e harness and first desktop client)"

[[bin]]
name = "sealbox"
path = "src/main.rs"

[dependencies]
sealbox-core = { path = "../sealbox-core" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
qrcode = { version = "0.14", default-features = false } # `key qr` (G30)

[dev-dependencies]
sealbox-mail = { path = "../sealbox-mail" }
tempfile = "3.27.0"
sealbox-server = { path = "../sealbox-server" } # gate_g15: in-process backup server
sealbox-fakeprov = { path = "../sealbox-fakeprov" } # gate_g21_sim: the provider simulators
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
