# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: `cargo deny check`.
# Sealbox is GPL-3.0-or-later (clients) / AGPL-3.0-or-later (server, relay); every dependency
# licence below is compatible with both.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 (rsa "Marvin" timing side channel): no fixed release exists. Tracked as
    # threat-model residual R13 (docs/THREAT_MODEL.md). Re-evaluate when rsa ships a fix.
    { id = "RUSTSEC-2023-0071", reason = "no upstream fix; documented residual R13" },
    # crypto-bigint 0.5 timing (via rPGP's NIST-curve code, peers' public data only): R13.
    { id = "RUSTSEC-2026-0387", reason = "needs an rPGP release; documented residual R13" },
    # Unmaintained, no replacement release yet: zbus stack (Linux keyring), pin-utils, chrono.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via the Linux keyring; no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via the Linux keyring; no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via the Linux keyring; no safe upgrade" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, transitive; no safe upgrade" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, transitive; no safe upgrade" },
    # app/rust only (flutter_rust_bridge's dependency tree):
    { id = "RUSTSEC-2024-0388", reason = "derivative via flutter_rust_bridge; no safe upgrade" },
    { id = "RUSTSEC-2025-0056", reason = "adler via flutter_rust_bridge; no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "bzip2-1.0.6",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
