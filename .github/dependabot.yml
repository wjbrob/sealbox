version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/app/rust", "/extension/wasm", "/fuzz"]
    schedule: { interval: weekly }
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: "/app"
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: "/extension"
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
