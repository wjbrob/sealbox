version: 2
# Kept deliberately quiet: one grouped PR per ecosystem per month, semver-major bumps handled by hand
# (they need code changes and a gate run). Security updates are not limited by this file.
updates:
  - package-ecosystem: cargo
    directories: ["/", "/app/rust", "/extension/wasm", "/fuzz"]
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: "/app"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dart:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/extension"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
