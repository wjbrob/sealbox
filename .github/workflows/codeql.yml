# CodeQL static analysis for the Rust crates and the JavaScript in the extension and guest viewer.
# (CodeQL has no Dart support; the Flutter app is covered by `flutter analyze` in ci.yml.)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - web/guest/vendor
              - extension/wasm/vendor
              - "**/pkg-web"
              - "**/pkg-node"
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
