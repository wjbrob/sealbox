# Sealbox CI — gate G26 (docs/RELEASE.md). Runs on every push/PR; the `v*` tags and manual runs
# additionally produce the release artifacts through scripts/gate_release.sh.
#
# Release builds run WITHOUT --no-pub on purpose: --no-pub skips plugin-registrant regeneration, and the
# debug registrant references the integration_test dev dependency that release builds exclude.
# Jobs: rust (fmt/clippy/test) · flutter-linux (analyze/test/build linux) · android (release APK, signed
# when the keystore secrets exist) · apple (macOS + iOS --no-codesign on a macOS runner) · windows ·
# release-gate (the G26 script end to end, uploads dist/).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  # Pinned, not "stable": each Rust release adds clippy lints, and `-D warnings` turns them into
  # failures unrelated to the change under test. Bump deliberately (and re-run the gates).
  RUST_TOOLCHAIN: "1.93.1"
  NDK_VERSION: "27.0.12077973"
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  supply-chain:
    name: Supply chain · cargo-deny, REUSE, gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check
          arguments: --all-features
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
      - name: gitleaks (history + tree)
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml .
          ./gitleaks dir --redact --config .gitleaks.toml .

  rust:
    name: Rust · fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: System packages (gpg is the OpenPGP interop oracle for gate G1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev gnupg chromium-browser || \
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev gnupg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  flutter-linux:
    name: Flutter · analyze, test, Linux release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-pub
        working-directory: app
      - run: flutter test --no-pub
        working-directory: app
      - run: flutter build linux --release
        working-directory: app
      - name: Pack the bundle
        run: |
          version="$(scripts/version.sh)"
          mkdir -p dist
          tar -C app/build/linux/x64/release -czf "dist/sealbox-${version}-linux-x64.tar.gz" --transform "s,^bundle,sealbox-${version},S" bundle
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealbox-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android · release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # secrets are not available in `if:`; mirror their presence into env first
      HAS_KEYSTORE: ${{ secrets.SEALBOX_KEYSTORE_BASE64 != '' && secrets.SEALBOX_KEY_PROPERTIES_CONTENT != '' }}
    steps:
      - name: Free disk space (the Android NDK + four Rust targets exceed the runner's default)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Production keystore from secrets (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SEALBOX_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.SEALBOX_KEY_PROPERTIES_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          printf '%s\n' "$KEY_PROPERTIES" > "$RUNNER_TEMP/signing/key.properties"
          sed -i "s|^storeFile=.*|storeFile=$RUNNER_TEMP/signing/upload.jks|" "$RUNNER_TEMP/signing/key.properties"
          echo "SEALBOX_KEY_PROPERTIES=$RUNNER_TEMP/signing/key.properties" >> "$GITHUB_ENV"
      - name: TEST keystore (no production secrets present)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          printf 'storeFile=%s/testing/keys/sealbox-test.jks\nstorePassword=sealbox-test\nkeyAlias=sealbox-test\nkeyPassword=sealbox-test\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/key.properties"
          echo "SEALBOX_KEY_PROPERTIES=$RUNNER_TEMP/key.properties" >> "$GITHUB_ENV"
          echo "::notice::Android artifacts are signed with the committed TEST keystore — not shippable"
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - run: flutter build appbundle --release
        working-directory: app
      - name: Verify signatures
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify app/build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealbox-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  apple:
    name: Apple · macOS release + iOS (no codesign)
    # Not a supported platform yet (Linux + Android only): manual runs only, never blocking.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --release
        working-directory: app
      - run: flutter build ios --release --no-codesign
        working-directory: app
      - name: Zip the macOS app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent app/build/macos/Build/Products/Release/sealbox_app.app "dist/sealbox-$(scripts/version.sh)-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealbox-macos
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows · release
    # Not a supported platform yet (Linux + Android only): manual runs only, never blocking.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sealbox-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error

  release-gate:
    name: G26 · scripts/gate_release.sh
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space (the Android NDK + four Rust targets exceed the runner's default)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux desktop toolchain + actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
          mkdir -p target/tools && cd target/tools
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf actionlint.tar.gz actionlint
      - run: scripts/gate_release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sealbox-dist
          path: dist/
          if-no-files-found: warn
